name: Capacitor Android Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build row id (uuid) from the app"
        required: true
        type: string
      website_url:
        description: "URL to wrap in the Capacitor shell"
        required: true
        type: string
      app_name:
        description: "Display name"
        required: true
        type: string
      package_id:
        description: "Android applicationId (com.example.app)"
        required: true
        type: string
      output:
        description: "apk | aab"
        required: false
        default: "apk"
        type: string
      callback_url:
        description: "Webhook URL to POST status back to"
        required: true
        type: string
      theme_color:
        description: "Hex theme color"
        required: false
        default: "#000000"
        type: string
      app_version:
        description: "Application version"
        required: false
        default: "1.0.0"
        type: string
      icon_url:
        description: "Signed URL for 1024x1024 icon PNG (optional)"
        required: false
        default: ""
        type: string
      splash_url:
        description: "Signed URL for 2732x2732 splash PNG (optional)"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Human-readable artifact base name (e.g. SentiraAI-v1.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBHOOK_SECRET: ${{ secrets.CAPACITOR_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact name
        id: name
        run: |
          NAME="${{ inputs.artifact_name }}"
          if [ -z "$NAME" ]; then
            NAME="app-${{ inputs.build_id }}"
          fi
          # sanitize: keep alnum, dot, dash, underscore
          NAME=$(printf "%s" "$NAME" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          if [ -z "$NAME" ]; then NAME="app-${{ inputs.build_id }}"; fi
          echo "value=$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact name: $NAME"

      - name: Notify start
        if: ${{ env.WEBHOOK_SECRET != '' }}
        run: |
          BODY=$(jq -nc \
            --arg build_id "${{ inputs.build_id }}" \
            --arg status "in_progress" \
            --argjson run_id ${{ github.run_id }} \
            --argjson run_attempt ${{ github.run_attempt }} \
            --arg logs_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{build_id:$build_id,status:$status,run_id:$run_id,run_attempt:$run_attempt,logs_url:$logs_url}')
          SIG=$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $2}')
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "x-capacitor-signature: sha256=$SIG" \
            --data "$BODY" || true

      - name: Record start time
        id: t0
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install deps
        run: npm ci || npm install

      - name: Patch config
        run: node scripts/patch.mjs
        env:
          INPUT_WEBSITE_URL: ${{ inputs.website_url }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_PACKAGE_ID: ${{ inputs.package_id }}
          INPUT_THEME_COLOR: ${{ inputs.theme_color }}

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Fetch & normalize branding assets
        env:
          ICON_URL: ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
          THEME_COLOR: ${{ inputs.theme_color }}
        run: |
          set -e
          mkdir -p resources
          COLOR="${THEME_COLOR:-#000000}"
          if [ -n "$ICON_URL" ]; then
            echo "Downloading icon from signed URL"
            curl -fsSL "$ICON_URL" -o /tmp/icon-src.png
            file /tmp/icon-src.png
            # Pad to a 1024x1024 square on the theme color so @capacitor/assets
            # accepts it as an adaptive-icon source regardless of source ratio.
            convert /tmp/icon-src.png \
              -resize 820x820\> \
              -background "$COLOR" -gravity center -extent 1024x1024 \
              -strip resources/icon.png
            identify resources/icon.png
          else
            echo "No icon_url provided — @capacitor/assets will skip icon generation"
          fi
          if [ -n "$SPLASH_URL" ]; then
            echo "Downloading splash from signed URL"
            curl -fsSL "$SPLASH_URL" -o /tmp/splash-src.png
            file /tmp/splash-src.png
            # Pad to a 2732x2732 square on the theme color — required by
            # @capacitor/assets so portrait + landscape splashes both render.
            convert /tmp/splash-src.png \
              -resize 2048x2048\> \
              -background "$COLOR" -gravity center -extent 2732x2732 \
              -strip resources/splash.png
            cp resources/splash.png resources/splash-dark.png
            identify resources/splash.png
          else
            echo "No splash_url provided — @capacitor/assets will skip splash generation"
          fi
          ls -la resources/




      - name: Add Android platform
        run: npx --yes cap add android || npx --yes cap sync android

      - name: Compute versionCode + versionName
        id: ver
        run: |
          # versionCode MUST be a strictly increasing integer for Google Play.
          # Use unix epoch seconds — monotonic, unique per build, fits int32
          # (max 2,100,000,000 ≈ year 2036, well under Play's 2,100,000,000 cap).
          VC=$(date +%s)
          VN="${{ inputs.app_version }}"
          if [ -z "$VN" ]; then VN="1.0.0"; fi
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "Resolved versionCode=$VC versionName=$VN"

      - name: Patch android/app/build.gradle (versionCode, versionName, applicationId)
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          set -e
          GRADLE_FILE=android/app/build.gradle
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::$GRADLE_FILE not found after cap add android"
            exit 1
          fi
          echo "--- Before patch ---"
          grep -E "applicationId|versionCode|versionName" "$GRADLE_FILE" || true
          perl -i -pe 's/applicationId\s+"[^"]*"/applicationId "'"$PACKAGE_ID"'"/g' "$GRADLE_FILE"
          perl -i -pe 's/versionCode\s+\d+/versionCode '"$VERSION_CODE"'/g' "$GRADLE_FILE"
          perl -i -pe 's/versionName\s+"[^"]*"/versionName "'"$VERSION_NAME"'"/g' "$GRADLE_FILE"
          echo "--- After patch ---"
          grep -E "applicationId|versionCode|versionName" "$GRADLE_FILE"

      - name: Generate Android icons and splash
        if: ${{ inputs.icon_url != '' || inputs.splash_url != '' }}
        run: |
          npx --yes @capacitor/assets generate \
            --android \
            --iconBackgroundColor "${{ inputs.theme_color }}" \
            --iconBackgroundColorDark "${{ inputs.theme_color }}" \
            --splashBackgroundColor "${{ inputs.theme_color }}" \
            --splashBackgroundColorDark "${{ inputs.theme_color }}"
          echo "--- Generated mipmap resources ---"
          ls -la android/app/src/main/res/mipmap-* 2>/dev/null || true
          echo "--- Generated drawable resources ---"
          ls -la android/app/src/main/res/drawable* 2>/dev/null || true

      - name: Sync
        run: npx --yes cap sync android

      - name: Build APK (debug-signed, installable)
        if: ${{ inputs.output == 'apk' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build AAB
        if: ${{ inputs.output == 'aab' }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Locate artifact
        id: artifact
        run: |
          if [ "${{ inputs.output }}" = "aab" ]; then
            FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n1)
          else
            FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          fi
          if [ -z "$FILE" ]; then
            echo "No artifact found" >&2
            exit 1
          fi
          DIR=$(dirname "$FILE")
          EXT="${FILE##*.}"
          NEW="$DIR/${{ steps.name.outputs.value }}.$EXT"
          mv "$FILE" "$NEW"
          echo "file=$NEW" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.name.outputs.value }}" >> "$GITHUB_OUTPUT"
          echo "--- artifact info ---"
          ls -la "$NEW"

      - name: Verify APK signature
        if: ${{ inputs.output == 'apk' }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --verbose "${{ steps.artifact.outputs.file }}" || {
            echo "::error::APK signature verification failed"
            exit 1
          }
          "$BUILD_TOOLS/aapt" dump badging "${{ steps.artifact.outputs.file }}" | head -5

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: ${{ steps.artifact.outputs.file }}
          retention-days: 14

      - name: Notify success
        if: success() && env.WEBHOOK_SECRET != ''
        run: |
          T1=$(date +%s)
          DUR=$(( (T1 - ${{ steps.t0.outputs.ts }}) * 1000 ))
          ART_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}"
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(jq -nc \
            --arg build_id "${{ inputs.build_id }}" \
            --arg status "succeeded" \
            --arg output "${{ inputs.output }}" \
            --arg artifact_url "$ART_URL" \
            --arg artifact_name "${{ steps.name.outputs.value }}" \
            --argjson artifact_id ${{ steps.upload.outputs.artifact-id }} \
            --arg logs_url "$LOGS_URL" \
            --argjson run_id ${{ github.run_id }} \
            --argjson run_attempt ${{ github.run_attempt }} \
            --argjson duration_ms $DUR \
            --arg version_code "${{ steps.ver.outputs.versionCode }}" \
            --arg version_name "${{ steps.ver.outputs.versionName }}" \
            '{build_id:$build_id,status:$status,output:$output,artifact_url:$artifact_url,artifact_name:$artifact_name,artifact_id:$artifact_id,logs_url:$logs_url,run_id:$run_id,run_attempt:$run_attempt,duration_ms:$duration_ms,version_code:$version_code,version_name:$version_name}')
          SIG=$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $2}')
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "x-capacitor-signature: sha256=$SIG" \
            --data "$BODY"

      - name: Notify failure
        if: failure() && env.WEBHOOK_SECRET != ''
        run: |
          T1=$(date +%s)
          DUR=$(( (T1 - ${{ steps.t0.outputs.ts }}) * 1000 ))
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(jq -nc \
            --arg build_id "${{ inputs.build_id }}" \
            --arg status "failed" \
            --arg logs_url "$LOGS_URL" \
            --arg error_message "Workflow run failed. See logs." \
            --argjson run_id ${{ github.run_id }} \
            --argjson run_attempt ${{ github.run_attempt }} \
            --argjson duration_ms $DUR \
            '{build_id:$build_id,status:$status,logs_url:$logs_url,error_message:$error_message,run_id:$run_id,run_attempt:$run_attempt,duration_ms:$duration_ms}')
          SIG=$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $2}')
          curl -sS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            --data "$BODY" || true

