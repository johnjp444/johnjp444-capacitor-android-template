name: Validate Workflows

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint + actionlint
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --no-cache-dir yamllint
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/

      - name: yamllint
        run: |
          set -euo pipefail
          cat > .yamllint.yml <<'YL'
          extends: relaxed
          rules:
            line-length: disable
            truthy:
              check-keys: false
            document-start: disable
            indentation:
              spaces: 2
              indent-sequences: consistent
          YL
          yamllint -c .yamllint.yml .github/workflows/

      - name: actionlint (GitHub Actions schema)
        run: actionlint -color

      - name: Parse + structural check (capacitor-android.yml)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --no-cache-dir pyyaml
          python3 - <<'PY'
          import sys, yaml
          p = '.github/workflows/capacitor-android.yml'
          with open(p) as f:
              doc = yaml.safe_load(f)
          errs = []
          if not isinstance(doc, dict):
              errs.append('not a mapping')
          name = doc.get('name')
          if name != 'Capacitor Android Build':
              errs.append(f'name mismatch: got {name!r}, expected "Capacitor Android Build"')
          # PyYAML maps top-level "on:" to True (YAML 1.1 boolean). Accept both.
          on = doc.get('on', doc.get(True))
          if not isinstance(on, dict) or 'workflow_dispatch' not in on:
              errs.append('workflow_dispatch trigger missing')
          if errs:
              for e in errs: print('::error::' + e)
              sys.exit(1)
          print('structural check passed')
          PY

      - name: Verify registration via GitHub API (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Wait up to 60s for GitHub to re-index the workflow
          for i in $(seq 1 30); do
            json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/capacitor-android.yml") || true
            state=$(echo "$json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('state',''))" 2>/dev/null || echo "")
            wf_name=$(echo "$json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('name',''))" 2>/dev/null || echo "")
            if [ "$state" = "active" ] && [ "$wf_name" = "Capacitor Android Build" ]; then
              echo "::notice::workflow registered correctly (name=$wf_name state=$state)"
              exit 0
            fi
            echo "attempt $i: state=$state name=$wf_name — retrying"
            sleep 2
          done
          echo "::error::workflow not registered correctly after 60s"
          echo "$json"
          exit 1
